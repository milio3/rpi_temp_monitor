{% from "components/icon.html" import icon %}
<header class="w-full bg-[#20252C] border-b border-[#414B58] px-6 py-4 shadow-sm">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
    <!-- Logotipo y Nombre del Sistema -->
    <div class="flex items-center gap-4">
      <div class="p-2.5 bg-[#282F38] text-[#8AB4F8] border border-[#414B58] rounded-lg shadow-inner">
        {{ icon("cpu", class="w-8 h-8") }}
      </div>
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-bold tracking-tight text-[#F0F2F5]">RPi Temp Monitor</h1>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[#282F38] text-[#8AB4F8] border border-[#414B58]">
            v{{ version }}
          </span>
        </div>
        <p class="text-sm text-[#ADB6C2]">Monitor Térmico Continuo & Observabilidad ARM64</p>
      </div>
    </div>

    <!-- Acciones y Estado del Sistema -->
    <div class="flex items-center gap-3">
      <!-- Indicador de Modo de Sensor -->
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#282F38] border border-[#414B58] text-sm text-[#C4CBD4]">
        <span class="w-2.5 h-2.5 rounded-full {{ 'bg-[#7DD9A5]' if summary.sensor_mode == 'físico' else 'bg-[#F2CC7D]' }}"></span>
        <span class="font-medium">Sensor: {{ summary.sensor_mode | capitalize }}</span>
      </div>

      <!-- Botón de Descarga CSV -->
      <a href="/api/v1/readings/export/csv"
         class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-[#F0F2F5] bg-[#282F38] hover:bg-[#303844] border border-[#414B58] rounded-lg transition-colors focus:ring-2 focus:ring-[#8AB4F8] focus:outline-none"
         title="Descargar historial completo en formato CSV">
        {{ icon("download", class="w-4 h-4 text-[#8AB4F8]") }}
        <span>Exportar CSV</span>
      </a>

      <!-- Botón de Refresco Manual con HTMX -->
      <button hx-get="/web/fragments/current-temp"
              hx-target="#current-temp-container"
              hx-swap="outerHTML"
              onclick="refreshAllCharts()"
              class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-[#171A1F] bg-[#8AB4F8] hover:bg-[#A6C7FF] rounded-lg font-semibold transition-colors focus:ring-2 focus:ring-[#A6C7FF] focus:outline-none shadow-sm cursor-pointer"
              title="Actualizar datos y gráficos de forma inmediata">
        {{ icon("refresh", class="w-4 h-4") }}
        <span>Actualizar</span>
      </button>
    </div>
  </div>
</header>
