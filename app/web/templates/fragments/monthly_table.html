{% from "components/icon.html" import icon %}
<div id="monthly-table-container" class="overflow-x-auto">
  <table class="w-full text-left border-collapse text-xs sm:text-sm">
    <thead>
      <tr class="border-b border-[#414B58] bg-[#282F38]/40 text-xs font-semibold text-[#ADB6C2] uppercase tracking-wider">
        <th scope="col" class="py-2 px-3 whitespace-nowrap">Mes</th>
        <th scope="col" class="py-2 px-3 text-right whitespace-nowrap">Mínima (24h)</th>
        <th scope="col" class="py-2 px-3 text-right whitespace-nowrap">Máxima (24h)</th>
        <th scope="col" class="py-2 px-3 text-right whitespace-nowrap">Promedio</th>
        <th scope="col" class="py-2 px-3 text-right whitespace-nowrap">Muestras</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-[#414B58]/30">
      {% for m in months[:4] %}
        <tr class="hover:bg-[#282F38]/40 transition-colors">
          <td class="py-1.5 px-3 font-semibold text-[#F0F2F5] whitespace-nowrap">
            {{ m.month }}
          </td>
          <td class="py-1.5 px-3 text-right text-[#8AB4F8] font-mono whitespace-nowrap font-medium" title="{{ m.min_time }}">
            {{ m.min }} °C
          </td>
          <td class="py-1.5 px-3 text-right text-[#FF9292] font-mono whitespace-nowrap font-medium" title="{{ m.max_time }}">
            {{ m.max }} °C
          </td>
          <td class="py-1.5 px-3 text-right text-[#C4CBD4] font-mono whitespace-nowrap">
            {{ m.avg }} °C
          </td>
          <td class="py-1.5 px-3 text-right text-[#ADB6C2] whitespace-nowrap">
            {{ "{:,}".format(m.count).replace(",", ".") }}
          </td>
        </tr>
      {% else %}
        <tr>
          <td colspan="5" class="py-4 text-center text-[#ADB6C2] whitespace-nowrap">
            No hay registros mensuales disponibles.
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
