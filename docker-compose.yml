version: '3.8'

services:
  webapp:
    build: .
    container_name: rpi_temp_webapp
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8085:8000"
    volumes:
      - ./data:/app/backend/data_storage # Persistencia de datos
      - ./backend:/app/backend # Desarrollo (opcional)
    restart: unless-stopped
    environment:
      - DB_PATH=/app/backend/data_storage/database.db
      - TZ=Europe/Madrid
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  monitor:
    build: .
    container_name: rpi_temp_monitor
    command: python monitor_service.py
    restart: unless-stopped
    privileged: true # Necesario para acceder a hardware sensores en algunos casos
    environment:
      - DB_PATH=/app/backend/data_storage/database.db
      - TZ=Europe/Madrid
    volumes:
      - ./data:/app/backend/data_storage
      - /sys:/sys:ro # Montura de solo lectura para sensores térmicos

volumes:
  data:
