<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPi Temp Monitor v3.1</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="selection:bg-cyan-500 selection:text-white overflow-x-hidden">

    <!-- Fondo de Orbes Brillantes (Eliminado para tema oscuro más limpio) -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none bg-[#020617]">
    </div>

    <div class="max-w-7xl mx-auto px-4 py-8 md:py-12">

        <!-- Cabecera -->
        <header
            class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6 glass-panel p-6 md:px-8 shadow-lg">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-slate-800 rounded-xl shadow-lg border border-slate-700">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                    </svg>
                </div>
                <div>
                    <h1
                        class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-purple-300 neon-text">
                        RPi Temp Monitor <span class="text-lg text-indigo-300 ml-2">v3.1</span>
                    </h1>
                    <p class="text-indigo-200/60 text-sm font-medium tracking-wide">Centro de Control Térmico</p>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <!-- Insignia de Estado -->
                <div
                    class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-800/50 border border-slate-700/50 backdrop-blur-md">
                    <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="statusText"
                        class="text-xs font-semibold uppercase tracking-wider text-slate-400">Iniciando</span>
                </div>

                <!-- Temperatura Principal - Escritorio -->
                <div class="hidden md:block text-right">
                    <div id="currentTemp"
                        class="text-5xl font-bold text-white font-[Outfit] tracking-tighter drop-shadow-lg">
                        --.--°
                    </div>
                </div>
            </div>
        </header>

        <!-- Rejilla Principal -->
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">

            <!-- Héroe de Temperatura Móvil (Solo visible en pantallas pequeñas) -->
            <div class="md:hidden glass-panel p-8 text-center mb-4">
                <div id="currentTempMobile"
                    class="text-7xl font-bold text-white font-[Outfit] tracking-tighter drop-shadow-2xl">
                    --.--°
                </div>
                <p id="lastUpdateTextMobile" class="text-slate-400 text-xs mt-2 font-mono">--:--:--</p>
            </div>

            <!-- Columna de Gráficos -->
            <div class="xl:col-span-2 space-y-6">
                <!-- Actividad 24h -->
                <div class="glass-panel p-6 md:p-8 relative overflow-hidden">
                    <div class="flex justify-between items-center mb-6 relative z-10">
                        <h2 class="font-bold text-xl text-slate-200 flex items-center gap-2">
                            <span class="w-1 h-6 bg-orange-500 rounded-full"></span>
                            Actividad (24h)
                        </h2>
                    </div>
                    <div class="h-80 w-full relative z-10">
                        <canvas id="dailyChart"></canvas>
                    </div>
                </div>

                <!-- Historial 30 Días -->
                <div class="glass-panel p-6 md:p-8 relative overflow-hidden">
                    <div class="flex justify-between items-center mb-6 relative z-10">
                        <h2 class="font-bold text-xl text-slate-200 flex items-center gap-2">
                            <span class="w-1 h-6 bg-rose-500 rounded-full"></span>
                            Tendencia (15 días)
                        </h2>
                    </div>
                    <div class="h-80 w-full relative z-10">
                        <canvas id="historyChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Columna de Estadísticas -->
            <div class="xl:col-span-1 glass-panel p-6 flex flex-col h-[800px] xl:h-auto overflow-hidden relative">
                <h2 class="font-bold text-xl text-white mb-6 flex items-center gap-2">
                    <span class="w-1 h-6 bg-indigo-400 rounded-full shadow-[0_0_10px_rgba(129,140,248,0.5)]"></span>
                    Mensual
                </h2>

                <div
                    class="grid grid-cols-3 gap-3 px-3 py-2 text-xs font-bold text-indigo-300 uppercase tracking-wider opacity-70 mb-2">
                    <div class="text-center">Mes</div>
                    <div class="text-center">Min</div>
                    <div class="text-center">Max</div>
                </div>

                <div id="monthlyStatsPreview" class="flex-grow overflow-y-auto custom-scrollbar space-y-3 pr-2">
                    <!-- Estado de Carga -->
                    <div class="animate-pulse space-y-3">
                        <div class="h-14 bg-slate-700/30 rounded-xl"></div>
                        <div class="h-14 bg-slate-700/30 rounded-xl"></div>
                        <div class="h-14 bg-slate-700/30 rounded-xl"></div>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-white/10">
                    <button onclick="openModal()"
                        class="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600/50 text-indigo-100 hover:text-white font-semibold shadow-md transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2">
                        <span>Ver Histórico Completo</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>

                    <p id="lastUpdateText"
                        class="text-center text-indigo-300/40 font-mono text-xs mt-4 hidden md:block">
                        Esperando datos...
                    </p>
                </div>
            </div>
        </div>

    </div>

    <!-- Superposición Modal -->
    <div id="historyModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4">
        <!-- Fondo -->
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" onclick="closeModal()"></div>

        <!-- Contenido Modal -->
        <div
            class="modal-content glass-panel w-full max-w-2xl max-h-[85vh] flex flex-col relative z-50 shadow-2xl border border-white/10">
            <!-- Cabecera -->
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h3 class="text-2xl font-bold text-white tracking-tight">Historial Completo</h3>
                <button onclick="closeModal()"
                    class="p-2 rounded-lg bg-white/5 hover:bg-white/10 transition-colors text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Cuerpo -->
            <div id="modalBody" class="p-6 overflow-y-auto custom-scrollbar bg-[#0f172a]/40">
                <!-- Content injected by JS -->
            </div>

            <!-- Pie -->
            <div class="p-4 border-t border-white/5 bg-white/5 flex justify-end">
                <a href="/api/readings/export/csv" target="_blank"
                    class="flex items-center gap-2 text-sm font-medium text-slate-400 hover:text-white transition-colors group">
                    <span>Descargar CSV</span>
                    <svg class="w-4 h-4 text-slate-500 group-hover:text-white transition-colors" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
