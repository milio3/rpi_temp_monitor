<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raspberry Pi - Monitor de Temperatura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .temp-normal {
            color: #16a34a;
            background-color: #dcfce7;
        }

        .temp-warning {
            color: #ea580c;
            background-color: #ffedd5;
        }

        .temp-critical {
            color: #dc2626;
            background-color: #fee2e2;
        }

        /* Tema oscuro */
        body.dark-mode {
            background-color: #0f172a;
            color: #e2e8f0;
        }

        body.dark-mode .bg-white {
            background-color: #1e293b;
            border-color: #334155;
        }

        body.dark-mode .text-slate-800 {
            color: #e2e8f0;
        }

        body.dark-mode .text-slate-700 {
            color: #cbd5e1;
        }

        body.dark-mode .text-slate-500 {
            color: #94a3b8;
        }

        body.dark-mode .text-slate-400 {
            color: #64748b;
        }

        body.dark-mode .text-slate-900 {
            color: #f1f5f9;
        }

        body.dark-mode .border-slate-100 {
            border-color: #334155;
        }

        body.dark-mode .bg-slate-50 {
            background-color: #0f172a;
        }

        body.dark-mode .bg-slate-100 {
            background-color: #1e293b;
        }

        body.dark-mode .bg-slate-200 {
            background-color: #334155;
        }

        body.dark-mode .hover\:bg-slate-200:hover {
            background-color: #334155;
        }

        body.dark-mode .text-slate-600 {
            color: #94a3b8;
        }

        body.dark-mode .border-t {
            border-color: #334155;
        }

        body.dark-mode a:hover {
            color: #f97316;
        }

        body.dark-mode .temp-normal {
            color: #22c55e;
            background-color: #166534;
        }

        body.dark-mode .temp-warning {
            color: #f97316;
            background-color: #7c2d12;
        }

        body.dark-mode .temp-critical {
            color: #ef4444;
            background-color: #991b1b;
        }

        .theme-toggle {
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }

        .theme-toggle:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .theme-toggle:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-slate-800">Panel de Control</h1>
                    <p class="text-slate-500 italic">Estado térmico de la CPU</p>
                </div>
                <button id="themeToggle" onclick="toggleTheme()" class="theme-toggle p-2 rounded-lg"
                    title="Cambiar tema">
                    <svg id="themeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
            <div class="text-right">
                <p class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-1">Temperatura Actual</p>
                <p id="currentTemp" class="text-6xl font-bold tracking-tight text-slate-800 dark:text-slate-100">
                    46.13 °C</p>
            </div>

        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4" style="min-height: 40px;">
                    <h2 class="text-lg font-bold text-slate-700 border-b-2 border-orange-500 inline-block">Últimas 24
                        Horas</h2>
                </div>
                <div class="h-64"><canvas id="dailyChart"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4" style="min-height: 40px;">
                    <h2
                        class="text-lg font-bold text-slate-700 dark:text-slate-200 border-b-2 border-orange-500 inline-block">
                        Histórico</h2>
                    <div class="bg-slate-100 dark:bg-slate-800 p-1 rounded-lg flex gap-1">
                        <button id="btnView30" onclick="setHistoryView('30')"
                            class="px-3 py-1 text-sm rounded-md bg-white dark:bg-slate-600 shadow-sm text-slate-800 dark:text-slate-100 font-medium transition-all">30
                            Días</button>
                        <button id="btnViewMonth" onclick="setHistoryView('month')"
                            class="px-3 py-1 text-sm rounded-md text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Meses</button>
                    </div>
                </div>

                <div class="h-64"><canvas id="historyChart"></canvas></div>
            </div>
        </div>

        <footer class="flex justify-between items-center text-sm text-slate-400 border-t pt-6">
            <p id="lastUpdate" class="flex items-center">
                <svg class="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Actualizado: 13:24:49
            </p>
            <a href="temp.log" class="hover:text-orange-600 font-semibold underline flex items-center">
                Descargar Datos Crudos (temp.log)
                <svg class="w-4 h-4 inline-block ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
            </a>
        </footer>
    </div>

    <script>

        // Datos inyectados desde Python
        const dailyData = JSON.parse('[{"x": "2026-01-24T00:00:01", "y": 37.48}, {"x": "2026-01-24T00:10:01", "y": 37.97}, {"x": "2026-01-24T00:20:01", "y": 38.46}, {"x": "2026-01-24T00:30:01", "y": 38.95}, {"x": "2026-01-24T00:40:02", "y": 38.95}, {"x": "2026-01-24T00:50:01", "y": 38.46}, {"x": "2026-01-24T01:00:01", "y": 38.46}, {"x": "2026-01-24T01:10:02", "y": 37.97}, {"x": "2026-01-24T01:20:01", "y": 38.46}, {"x": "2026-01-24T01:30:01", "y": 40.89}, {"x": "2026-01-24T01:40:01", "y": 40.41}, {"x": "2026-01-24T01:50:02", "y": 38.95}, {"x": "2026-01-24T02:00:01", "y": 38.95}, {"x": "2026-01-24T02:10:01", "y": 39.43}, {"x": "2026-01-24T02:20:02", "y": 37.48}, {"x": "2026-01-24T02:30:01", "y": 38.46}, {"x": "2026-01-24T02:40:01", "y": 38.46}, {"x": "2026-01-24T02:50:01", "y": 38.46}, {"x": "2026-01-24T03:00:01", "y": 38.46}, {"x": "2026-01-24T03:10:01", "y": 37.0}, {"x": "2026-01-24T03:20:02", "y": 37.97}, {"x": "2026-01-24T03:30:01", "y": 39.43}, {"x": "2026-01-24T03:40:01", "y": 38.46}, {"x": "2026-01-24T03:50:01", "y": 37.97}, {"x": "2026-01-24T04:00:02", "y": 38.95}, {"x": "2026-01-24T04:10:01", "y": 39.43}, {"x": "2026-01-24T04:20:01", "y": 38.46}, {"x": "2026-01-24T04:30:02", "y": 38.46}, {"x": "2026-01-24T04:40:01", "y": 37.48}, {"x": "2026-01-24T04:50:01", "y": 37.97}, {"x": "2026-01-24T05:00:01", "y": 37.97}, {"x": "2026-01-24T05:10:01", "y": 37.0}, {"x": "2026-01-24T05:20:01", "y": 37.97}, {"x": "2026-01-24T05:30:01", "y": 38.46}, {"x": "2026-01-24T05:40:01", "y": 38.46}, {"x": "2026-01-24T05:50:01", "y": 37.97}, {"x": "2026-01-24T06:00:01", "y": 37.97}, {"x": "2026-01-24T06:10:02", "y": 37.97}, {"x": "2026-01-24T06:20:01", "y": 37.0}, {"x": "2026-01-24T06:30:01", "y": 37.48}, {"x": "2026-01-24T06:40:01", "y": 37.48}, {"x": "2026-01-24T06:50:01", "y": 37.48}, {"x": "2026-01-24T07:00:01", "y": 37.0}, {"x": "2026-01-24T07:10:02", "y": 37.48}, {"x": "2026-01-24T07:20:01", "y": 37.0}, {"x": "2026-01-24T07:30:02", "y": 37.97}, {"x": "2026-01-24T07:40:01", "y":         const historyData = JSON.parse('[{"d": "2026-01-05", "min": 56.3, "max": 58.5, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-06", "min": 34.56, "max": 59.89, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-07", "min": 35.05, "max": 41.38, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-08", "min": 35.54, "max": 39.92, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-09", "min": 35.05, "max": 41.87, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-10", "min": 35.05, "max": 43.33, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-11", "min": 36.02, "max": 40.41, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-12", "min": 35.54, "max": 42.35, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-13", "min": 36.51, "max": 41.87, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-14", "min": 37.0, "max": 41.87, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-15", "min": 36.51, "max": 41.38, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-16", "min": 37.0, "max": 42.84, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-17", "min": 36.51, "max": 42.84, "min_t": "00:00", "max_t": "00:00"}, {"d": "2026-01-18", "min": 36.51, "max": 47.23, "min_t": "09:50", "max_t": "13:10"}, {"d": "2026-01-19", "min": 36.51, "max": 42.84, "min_t": "06:20", "max_t": "12:00"}, {"d": "2026-01-20", "min": 36.51, "max": 40.89, "min_t": "05:40", "max_t": "09:20"}, {"d": "2026-01-21", "min": 36.51, "max": 41.87, "min_t": "06:50", "max_t": "10:10"}, {"d": "2026-01-22", "min": 36.51, "max": 41.38, "min_t": "06:30", "max_t": "12:30"}, {"d": "2026-01-23", "min": 36.51, "max": 42.35, "min_t": "07:30", "max_t": "10:00"}]');
        const monthlyData = JSON.parse('[{"d": "2026-01", "min": 34.56, "max": 59.89, "min_d": "2026-01-06", "max_d": "2026-01-06"}]');

        // --- Gestión de Tema ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);

            if (isDark) {
                document.body.classList.add('dark-mode');
                updateThemeIcon(true);
            } else {
                document.body.classList.remove('dark-mode');
                updateThemeIcon(false);
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
            updateChartColors(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.innerHTML = '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
            } else {
                icon.innerHTML = '<path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
            }
        }

        function updateChartColors(isDark) {
            const gridColor = isDark ? 'rgba(148, 163, 184, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            const textColor = isDark ? '#cbd5e1' : '#64748b';

            if (dailyChart) {
                dailyChart.options.scales.x.grid.color = gridColor;
                dailyChart.options.scales.y.grid.color = gridColor;
                dailyChart.options.scales.x.ticks.color = textColor;
                dailyChart.options.scales.y.ticks.color = textColor;
                dailyChart.update('none');
            }

            if (historyChart) {
                historyChart.options.scales.x.grid.color = gridColor;
                historyChart.options.scales.y.grid.color = gridColor;
                historyChart.options.scales.x.ticks.color = textColor;
                historyChart.options.scales.y.ticks.color = textColor;
                historyChart.update('none');
            }
        }

        // --- Actualización de UI ---
        function updateTempStatus(temp) {
            const tempEl = document.getElementById('currentTemp');
            tempEl.textContent = temp.toFixed(2) + ' °C';

            // Estilos base
            tempEl.className = 'text-6xl font-bold tracking-tight';

            // Colores por umbral
            if (temp >= 80) {
                tempEl.classList.add('text-red-600');
            } else if (temp >= 70) {
                tempEl.classList.add('text-orange-600');
            } else {
                tempEl.classList.add('text-slate-800', 'dark:text-slate-100');
            }
        }

        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('lastUpdate').textContent = 'Actualizado: ' + timeStr;
        }

        // --- Gráficos ---
        initTheme(); // Inicializar tema antes de gráficos para colores correctos

        const isDarkMode = document.body.classList.contains('dark-mode');
        const gridColor = isDarkMode ? 'rgba(148, 163, 184, 0.1)' : 'rgba(0, 0, 0, 0.1)';
        const textColor = isDarkMode ? '#cbd5e1' : '#64748b';

        // Gráfico Diario (Línea)
        dailyChart = new Chart(document.getElementById('dailyChart'), {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Temp °C',
                    data: dailyData,
                    borderColor: '#ea580c',
                    backgroundColor: 'rgba(234, 88, 12, 0.1)',
                    fill: true, tension: 0.4, pointRadius: 0, hoverPointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { intersect: false, mode: 'index' },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                return context.parsed.y.toFixed(2) + ' °C';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'hour',
                            tooltipFormat: 'PPpp',
                            displayFormats: {
                                hour: 'HH:mm'
                            }
                        },
                        grid: { color: gridColor },
                        ticks: { color: textColor, major: { enabled: true }, maxRotation: 45, minRotation: 45 }
                    },
                    y: { grid: { color: gridColor }, ticks: { color: textColor } }
                }
            }
        });

        // Gráfico Historial (Líneas con relleno)
        let isMonthlyView = false;

        function getHistoryDatasets(data, isMonthly) {
            return [
                {
                    label: 'Máxima',
                    data: data.map(d => d.max),
                    borderColor: '#ef4444',
                    backgroundColor: 'rgba(239, 68, 68, 0.05)',
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    fill: false
                },
                {
                    label: 'Mínima',
                    data: data.map(d => d.min),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.15)', // Color del área entre min y max
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    fill: '-1' // Rellena hasta el dataset anterior (Máxima)
                }
            ];
        }

        historyChart = new Chart(document.getElementById('historyChart'), {
            type: 'line',
            data: {
                labels: historyData.map(d => d.d.substring(5)),
                datasets: getHistoryDatasets(historyData, false)
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            title: function (context) { return context[0].label; },
                            label: function (context) {
                                const d = isMonthlyView ? monthlyData[context.dataIndex] : historyData[context.dataIndex];
                                let val = context.parsed.y;
                                let label = context.dataset.label + ': ' + val + '°C';

                                if (isMonthlyView) {
                                    if (context.dataset.label === 'Máxima' && d.max_d) {
                                        label += ` (el ${d.max_d.substring(5)})`;
                                    }
                                    if (context.dataset.label === 'Mínima' && d.min_d) {
                                        label += ` (el ${d.min_d.substring(5)})`;
                                    }
                                } else {
                                    if (context.dataset.label === 'Máxima' && d.max_t) {
                                        label += ` (${d.max_t})`;
                                    }
                                    if (context.dataset.label === 'Mínima' && d.min_t) {
                                        label += ` (${d.min_t})`;
                                    }
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { color: gridColor }, ticks: { color: textColor, maxRotation: 45, minRotation: 45 } },
                    y: { grid: { color: gridColor }, ticks: { color: textColor } }
                }
            }
        });

        window.setHistoryView = function (mode) {
            const btn30 = document.getElementById('btnView30');
            const btnMonth = document.getElementById('btnViewMonth');

            isMonthlyView = (mode === 'month');

            const activeClass = "px-3 py-1 text-sm rounded-md bg-white dark:bg-slate-700 shadow-sm text-slate-800 dark:text-slate-200 font-medium transition-all";
            const inactiveClass = "px-3 py-1 text-sm rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors";

            if (isMonthlyView) {
                btn30.className = inactiveClass;
                btnMonth.className = activeClass;
                historyChart.data.labels = monthlyData.map(d => d.d);
                historyChart.data.datasets = getHistoryDatasets(monthlyData, true);
            } else {
                btn30.className = activeClass;
                btnMonth.className = inactiveClass;
                historyChart.data.labels = historyData.map(d => d.d.substring(5));
                historyChart.data.datasets = getHistoryDatasets(historyData, false);
            }
            historyChart.update();
        };

        // Estado inicial
        updateTempStatus(CURRENT_TEMP_VALUE);
    </script>

    <script>
        // Recargar la página automáticamente cada 60 segundos para obtener datos frescos.
        setInterval(() => {
            window.location.reload();
        }, 60000); // 60000 milisegundos = 60 segundos
    </script>
</body>
